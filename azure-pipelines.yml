trigger:
  branches:
    include:
      - main

variables:
  acrName: 'myappacr123'
  imageName: 'myapp'
  resourceGroup: 'myapp-rg'
  aksCluster: 'myapp-aks'
  serviceConnection: 'myapp-service-connection'

stages:
  - stage: CI
    displayName: 'CI: Install, Lint, Test'
    jobs:
      - job: BuildAndTest
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Install Node.js'

          - script: npm ci
            displayName: 'Install dependencies'

          - script: npm run lint --if-present
            displayName: 'Run linter'

          - script: npm run test -- --run --passWithNoTests
            displayName: 'Run tests'

          - script: npm run build
            displayName: 'Build app (sanity check)'

  - stage: Build
    displayName: 'Build: Docker Image'
    dependsOn: CI
    condition: succeeded()
    jobs:
      - job: BuildAndPushImage
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: 'Build and push Docker image'
            inputs:
              azureSubscription: '$(serviceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr login --name $(acrName)
                docker build -t $(acrName).azurecr.io/$(imageName):$(Build.SourceVersion) -t $(acrName).azurecr.io/$(imageName):latest .
                docker push $(acrName).azurecr.io/$(imageName):$(Build.SourceVersion)
                docker push $(acrName).azurecr.io/$(imageName):latest

  - stage: Deploy
    displayName: 'CD: Deploy to AKS'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeployToAKS
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Deploy to AKS'
                  inputs:
                    azureSubscription: '$(serviceConnection)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az aks install-cli
                      az aks get-credentials --resource-group $(resourceGroup) --name $(aksCluster) --overwrite-existing
                      kubectl set image deployment/myapp myapp=$(acrName).azurecr.io/$(imageName):$(Build.SourceVersion) --record || kubectl apply -f k8s/
                      kubectl rollout status deployment/myapp
